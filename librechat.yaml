# Models are managed in the LiteLLM UI; LibreChat only reads their list.
version: 1.3.17
cache: true

endpoints:
  custom:
    - name: 'LiteLLM'
      apiKey: '${LITELLM_API_KEY}'
      baseURL: 'http://litellm:4000/v1'
      models:
        default: ['no-models-in-litellm-yet']
        fetch: true
      titleConvo: true
      titleModel: 'current_model'
      modelDisplayLabel: 'LiteLLM'

mcpSettings:
  allowedDomains:
    - doc-guide

mcpServers:
  doc-guide:
    title: Документация
    description: Показывает, чего не хватает в документации проекта, ведёт по шагам, правит файлы и публикует их
    type: streamable-http
    url: http://doc-guide:8000/mcp
    timeout: 120000
    chatMenu: true

# Хелперы документации. Модель можно заменить здесь, инструкция совпадает с prompt helper в doc-guide.
modelSpecs:
  enforce: false
  prioritize: false
  list:
  - name: helper-rnd
    label: 'Хелпер: исследования'
    description: Бриф, варианты и выбор
    group: Хелперы документации
    mcpServers:
    - doc-guide
    preset:
      endpoint: LiteLLM
      model: qwen-test
      modelLabel: 'Хелпер: исследования'
      promptPrefix: 'Ты помогаешь человеку заполнить документацию проекта. Твоя область: Анализ: исследования, бриф и выбор вариантов.


        Сначала вызови list_projects и спроси, с каким проектом работать, если человек его не назвал.


        Порядок работы:

        1. Вызови begin_step один раз. Что отсутствует и что делать дальше решает инструмент, не ты. Следующий вопрос всегда приходит в ответе answer, вместе с новым шагом. Сам вопросы не придумывай, задавай только пришедший.

        2. Покажи человеку вопрос и объясни его причину своими простыми словами. Он может не знать терминов. Смысл вопроса и порядок не меняй.

        3. Если человек просит помочь, предложи черновик ответа по его словам и спроси, верно ли это. В answer передавай только то, что он написал или подтвердил.

        4. Если ответ не принят, объясни причину и предложи переформулировать по примеру.

        5. Если вопрос не подходит продукту, предложи ответить «неприменимо: причина». Если человек не знает, передай «не знаю».

        6. На один ход задавай один вопрос и жди человека. Никогда не вызывай answer, пока человек не написал новое сообщение.

        7. Чего не хватает, показывает what_is_missing, все виды объектов list_forms, новый объект вне очереди add_object. Страницу показывает open_docs, проверку всего проекта validate_all.


        Менять можно только документацию проекта. Правила, нотацию и инструменты менять нельзя.'
      temperature: 0.3
  - name: helper-sdd
    label: 'Хелпер: требования'
    description: Требования, эпики и истории
    group: Хелперы документации
