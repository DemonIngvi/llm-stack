# Models are managed in the LiteLLM UI; LibreChat only reads their list.
version: 1.3.17
cache: true

endpoints:
  custom:
    - name: 'LiteLLM'
      apiKey: '${LITELLM_API_KEY}'
      baseURL: 'http://litellm:4000/v1'
      models:
        default: ['no-models-in-litellm-yet']
        fetch: true
      titleConvo: true
      titleModel: 'current_model'
      modelDisplayLabel: 'LiteLLM'
    # Хелперы документации: управляет скрипт, модель из HELPER_MODEL только пишет пояснение.
    - name: 'Хелперы'
      apiKey: 'none'
      baseURL: 'http://doc-dialog:8000/v1'
      models:
        default: ['helper-rnd', 'helper-sdd', 'helper-ux', 'helper-architecture', 'helper-delivery']
        fetch: false
      titleConvo: false
      modelDisplayLabel: 'Хелпер'
    # DeepSeek Harness: сообщение уходит прямо в сессию dsh, модель LibreChat не участвует.
    # Модель в списке — та, на которой работает dsh; номер разговора связывает его с сессией dsh.
    - name: 'DeepSeek Harness'
      apiKey: 'none'
      baseURL: 'http://dsh-bridge:8000/v1'
      headers:
        X-Conversation-Id: '{{LIBRECHAT_BODY_CONVERSATIONID}}'
        X-User-Id: '{{LIBRECHAT_USER_ID}}'
      models:
        default: ['no-models-in-litellm-yet']
        fetch: true
      titleConvo: false
      modelDisplayLabel: 'DeepSeek Harness'

mcpSettings:
  allowedDomains:
    - doc-guide
    - dsh-bridge

mcpServers:
  doc-guide:
    title: Документация
    description: Показывает, чего не хватает в документации проекта, ведёт по шагам, правит файлы и публикует их
    type: streamable-http
    url: http://doc-guide:8000/mcp
    timeout: 120000
    chatMenu: true
  # Для агентов LibreChat: передать задачу в dsh и получить короткий статус и итог.
  dsh:
    title: DeepSeek Harness
    description: Передаёт задачу агенту dsh, возвращает короткий статус и итог
    type: streamable-http
    url: http://dsh-bridge:8000/mcp
    timeout: 60000
    chatMenu: false

# Подписи хелперов в выборе модели.
modelSpecs:
  enforce: false
  prioritize: false
  list:
  - name: helper-rnd
    label: 'Хелпер: исследования'
    description: Бриф, варианты и выбор
    group: Хелперы документации
    preset:
      endpoint: Хелперы
      model: helper-rnd
      modelLabel: 'Хелпер: исследования'
  - name: helper-sdd
    label: 'Хелпер: требования'
    description: Требования, эпики и истории
    group: Хелперы документации
    preset:
      endpoint: Хелперы
      model: helper-sdd
      modelLabel: 'Хелпер: требования'
  - name: helper-ux
    label: 'Хелпер: интерфейс'
    description: Экраны, состояния, вид
    group: Хелперы документации
    preset:
      endpoint: Хелперы
      model: helper-ux
      modelLabel: 'Хелпер: интерфейс'
  - name: helper-architecture
    label: 'Хелпер: архитектура'
    description: Решения, компоненты, данные, каналы
    group: Хелперы документации
    preset:
      endpoint: Хелперы
      model: helper-architecture
      modelLabel: 'Хелпер: архитектура'
  - name: helper-delivery
    label: 'Хелпер: реализация'
    description: Файл истории, задачи, приёмка
    group: Хелперы документации
    preset:
      endpoint: Хелперы
      model: helper-delivery
      modelLabel: 'Хелпер: реализация'
